<ion-app>
  <ion-content
    class="bg-gradient-to-br from-primary-600 via-secondary-800 to-secondary-900 min-h-screen relative overflow-x-hidden"
  >
    <!-- Animated background elements - Exact copy from Astro project -->
    <div class="fixed inset-0 pointer-events-none">
      <div
        class="absolute top-10 left-10 w-72 h-72 bg-primary-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-float"
      ></div>
      <div
        class="absolute top-40 right-10 w-80 h-80 bg-accent-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-float"
        style="animation-delay: 1s"
      ></div>
      <div
        class="absolute bottom-10 left-1/2 w-96 h-96 bg-primary-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-float"
        style="animation-delay: 2s"
      ></div>
    </div>

    <!-- Main content area -->
    <div class="relative z-10 min-h-screen center-flex flex-col">
      <!-- Welcome Section -->
      <div
        class="glass rounded-3xl p-8 text-center animate-fade-in-up max-w-md w-full mx-4"
      >
        <h1 class="text-4xl font-black text-white mb-4">
          <span
            class="bg-gradient-to-r from-white via-primary-200 to-accent-300 bg-clip-text text-transparent"
          >
            TIZA GO
          </span>
        </h1>
        <p class="text-lg text-white/80 mb-6">
          La app de entregas local más
          <span class="text-accent-400 font-bold">RÁPIDA</span> de Tizayuca
        </p>
        <p class="text-white/70 text-sm">
          🚀 Conectamos tu negocio con toda la ciudad
        </p>
      </div>

      <!-- Status Message -->
      <div
        class="glass-subtle rounded-2xl p-6 mt-8 mx-4 animate-fade-in"
        style="animation-delay: 0.5s"
      >
        <div class="flex items-center justify-center space-x-3">
          <div class="w-3 h-3 bg-accent-500 rounded-full animate-pulse"></div>
          <span class="text-white/80 text-sm font-medium"
            >Fondo del proyecto Astro aplicado correctamente</span
          >
        </div>
      </div>
    </div>

    <!-- Decorative floating particles -->
    <div
      class="absolute top-16 left-4 w-3 h-3 bg-primary-500 rounded-full animate-ping opacity-60"
    ></div>
    <div
      class="absolute top-32 right-8 w-4 h-4 bg-accent-500 rounded-full animate-bounce opacity-60"
      style="animation-delay: 1s"
    ></div>
    <div
      class="absolute bottom-32 left-8 w-2 h-2 bg-primary-400 rounded-full animate-pulse opacity-60"
      style="animation-delay: 2s"
    ></div>
  </ion-content>
</ion-app>
