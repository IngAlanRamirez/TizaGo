<ion-content class="ion-padding">
  <div
    class="min-h-screen bg-gradient-to-br from-red-600 via-red-700 to-red-800 flex items-center justify-center p-4"
  >
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-8">
        <ion-icon
          name="restaurant-outline"
          class="text-6xl text-white mb-4"
        ></ion-icon>
        <h1 class="text-3xl font-bold text-white mb-2">TizaGo</h1>
        <p class="text-white/80 text-lg">¿Cómo quieres usar TizaGo?</p>
      </div>

      <!-- Opciones de registro -->
      <div class="space-y-4">
        <!-- Opción Cliente -->
        <ion-card
          (click)="onSelectClientRegister()"
          class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl cursor-pointer hover:bg-white/20 transition-all duration-300 transform hover:scale-[1.02] shadow-xl"
        >
          <ion-card-content class="p-6">
            <div class="flex items-center space-x-4">
              <div class="bg-green-500/20 p-3 rounded-full">
                <ion-icon
                  name="person-outline"
                  class="text-2xl text-green-400"
                ></ion-icon>
              </div>
              <div class="flex-1">
                <h3 class="text-xl font-bold text-white mb-1">Soy Cliente</h3>
                <p class="text-white/70 text-sm">
                  Quiero pedir comida a domicilio
                </p>
                <div class="flex items-center mt-2 text-white/60 text-xs">
                  <ion-icon
                    name="checkmark-circle-outline"
                    class="mr-1"
                  ></ion-icon>
                  <span>Pide tu comida favorita</span>
                </div>
                <div class="flex items-center mt-1 text-white/60 text-xs">
                  <ion-icon
                    name="checkmark-circle-outline"
                    class="mr-1"
                  ></ion-icon>
                  <span>Entrega rápida y segura</span>
                </div>
              </div>
              <ion-icon
                name="chevron-forward-outline"
                class="text-white/60 text-xl"
              ></ion-icon>
            </div>
          </ion-card-content>
        </ion-card>

        <!-- Opción Negocio -->
        <ion-card
          (click)="onSelectBusinessRegister()"
          class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl cursor-pointer hover:bg-white/20 transition-all duration-300 transform hover:scale-[1.02] shadow-xl"
        >
          <ion-card-content class="p-6">
            <div class="flex items-center space-x-4">
              <div class="bg-blue-500/20 p-3 rounded-full">
                <ion-icon
                  name="storefront-outline"
                  class="text-2xl text-blue-400"
                ></ion-icon>
              </div>
              <div class="flex-1">
                <h3 class="text-xl font-bold text-white mb-1">Soy Negocio</h3>
                <p class="text-white/70 text-sm">Quiero vender mis productos</p>
                <div class="flex items-center mt-2 text-white/60 text-xs">
                  <ion-icon
                    name="checkmark-circle-outline"
                    class="mr-1"
                  ></ion-icon>
                  <span>Aumenta tus ventas</span>
                </div>
                <div class="flex items-center mt-1 text-white/60 text-xs">
                  <ion-icon
                    name="checkmark-circle-outline"
                    class="mr-1"
                  ></ion-icon>
                  <span>Llega a más clientes</span>
                </div>
              </div>
              <ion-icon
                name="chevron-forward-outline"
                class="text-white/60 text-xl"
              ></ion-icon>
            </div>
          </ion-card-content>
        </ion-card>
      </div>

      <!-- Separador -->
      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-white/20"></div>
        <span class="px-4 text-white/60 text-sm">o</span>
        <div class="flex-1 h-px bg-white/20"></div>
      </div>

      <!-- Enlace a login -->
      <div class="text-center">
        <p class="text-white/70 mb-2">¿Ya tienes cuenta?</p>
        <ion-button
          fill="clear"
          (click)="onLogin()"
          class="text-white/90 hover:text-white font-semibold"
        >
          Iniciar sesión
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
